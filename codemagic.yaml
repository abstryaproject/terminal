workflows:
  android-debug-apk:
    name: Linux Terminal Android - Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.11.1"
    scripts:
      - name: Verify build tools
        script: |
          java -version
          if ! command -v gradle >/dev/null 2>&1; then
            echo "Gradle is not preinstalled; downloading Gradle ${GRADLE_VERSION}"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              --output /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"
          fi
          gradle --version
          echo "export PATH=\"$(dirname "$(command -v gradle)"):$PATH\"" >> "$CM_ENV"
      - name: Build debug APK
        script: |
          gradle --no-daemon --stacktrace :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/mapping/**/mapping.txt
